<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>آراگورن</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Pinned + SRI: this script builds the wallet transfer, so a tampered copy must not load. -->
  <script src="https://unpkg.com/@tonconnect/ui@5.0.1/dist/tonconnect-ui.min.js"
          integrity="sha384-QZvMrS6g6/TQyHjoc44P3RG1Kzfqnwen5A/EZ0LaQZKP8hvNY2stUmyFB5QDIKmp"
          crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap">
  <style>
    /* "Shab-neshini" style tile: night band + lamp saffron over warm paper. */
    :root {
      --night: #2B1F3A; --on-night: #F7EBDD; --on-night-muted: #C9B8D6;
      --paper: #F4ECE0; --card: #FFF9F0; --field: #FFFFFF; --ink: #2A2030; --muted: #6E6170;
      --line: #E2D5C2; --dash: #CDBBA3;
      --pom: #B5372F; --hot: #B5372F; --pom-soft: #F9E3DE; --pom-text: #9C2E27;
      --teal: #1D6F6A; --link: #1D6F6A; --saffron: #F2B441; --wood: #8A5A3B;
      --display: Lalezar, Vazirmatn, Tahoma, sans-serif;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --paper: #1E1828; --card: #2A2236; --field: #231C2E; --ink: #F4ECE0; --muted: #B3A6BC;
      --line: #3D3249; --dash: #56486A; --hot: #F08A7E; --pom-soft: #3C2230; --pom-text: #F0A39A; --link: #6FCFC3;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.7 Vazirmatn, Tahoma, sans-serif; }
    h1, h2, h3, p { margin: 0; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .6; }
    a { color: var(--link); }
    :focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
    #view { max-width: 480px; margin: 0 auto; padding-bottom: 32px; }
    body.with-dock #view { padding-bottom: 112px; }
    .display { font-family: var(--display); font-weight: 400; line-height: 1.35; }
    .meta { font-size: 13px; color: var(--muted); }
    .icon { display: inline-flex; flex: none; }
    .icon svg { display: block; }
    .grow { flex: 1; min-width: 0; }
    .loading { padding: 40px 20px; text-align: center; color: var(--muted); }

    /* night band + fairy lights */
    .night { background: var(--night); color: var(--on-night); border-radius: 0 0 28px 28px; padding-bottom: 20px; }
    .lights { display: block; width: 100%; height: auto; }
    .lights .wire { stroke: var(--dash); }
    .night .lights .wire { stroke: #5B4A70; }
    .brand-row { display: flex; align-items: baseline; gap: 8px; padding: 0 20px; }
    .brand { font-family: var(--display); font-size: 26px; color: var(--saffron); }
    .brand-sub, .greet { font-size: 13px; color: var(--on-night-muted); }
    .greet { margin: 14px 20px 0; }
    .night h1 { margin: 0 20px; font-size: 38px; }
    .strip { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 4px; scrollbar-width: none; }
    .strip::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 66px; min-height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center;
           padding: 8px 4px; border-radius: 16px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: var(--on-night); }
    .day[aria-pressed="true"] { background: var(--saffron); border-color: var(--saffron); color: #2A2030; }
    .day-top { font-size: 12px; font-weight: 500; }
    .day-num { font-family: var(--display); font-size: 28px; line-height: 1.2; }
    .day-count { font-size: 11px; color: var(--on-night-muted); }
    .day[aria-pressed="true"] .day-count { color: #2A2030; }
    .paper-head { padding: 4px 20px 0; }
    .paper-head h1 { font-size: 34px; }
    .paper-head p { font-size: 14px; color: var(--muted); }

    /* home: tickets */
    .pad { padding: 24px 20px 0; }
    .list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .list-head h2 { font-size: 26px; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .ticket { position: relative; display: flex; width: 100%; padding: 0; border: 0; border-radius: 16px; background: var(--card);
              text-align: start; box-shadow: 0 1px 0 var(--line), 0 8px 20px rgba(43,31,58,.06); }
    .ticket::before, .ticket::after { content: ""; position: absolute; inset-inline-start: 70px; width: 18px; height: 18px;
                                      border-radius: 50%; background: var(--paper); }
    .ticket::before { top: -9px; }
    .ticket::after { bottom: -9px; }
    .stub { flex: 0 0 78px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 14px 0; border-inline-end: 2px dashed var(--line); }
    .stub-time { font-family: var(--display); font-size: 26px; line-height: 1.15; color: var(--hot); }
    .ticket-body { flex: 1; min-width: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; }
    .ticket-title { font-size: 16px; font-weight: 700; line-height: 1.5; }
    .ticket-place { display: flex; align-items: center; gap: 4px; font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; padding: 2px 10px; border-radius: 999px; }
    .chip-teal { border: 1px solid var(--link); color: var(--link); }
    .chip-pom { display: inline-flex; align-items: center; gap: 4px; background: var(--pom-soft); color: var(--pom-text); }
    .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 36px 24px;
             border-radius: 20px; border: 1.5px dashed var(--dash); }
    .empty .display { font-size: 22px; margin-top: 6px; }
    .empty p:last-child { font-size: 14px; line-height: 1.8; color: var(--muted); }

    /* dock */
    #dock { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
    #dock[hidden] { display: none; }
    .dock { pointer-events: auto; display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: var(--night);
            box-shadow: 0 10px 30px rgba(43,31,58,.28); }
    .dock button { display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px; border: 0; border-radius: 999px;
                   background: transparent; color: #E9DDF0; font-size: 14px; font-weight: 500; }
    .dock button[aria-current="page"] { background: var(--saffron); color: #2A2030; font-weight: 700; }

    /* event detail */
    .poster { position: relative; height: 150px; background: var(--teal); }
    .sticker { position: absolute; top: 20px; inset-inline-start: 20px; transform: rotate(-6deg); padding: 4px 14px; border-radius: 8px;
               background: var(--saffron); color: #2A2030; font-family: var(--display); font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,.18); }
    .ticket-big { position: relative; margin: -56px 16px 0; border-radius: 22px; background: var(--card); box-shadow: 0 12px 32px rgba(43,31,58,.14); }
    .tb-head { padding: 22px 22px 18px; }
    .tb-head h1 { font-size: 30px; }
    .perf { position: relative; margin: 0 18px; border-top: 2px dashed var(--line); }
    .perf::before, .perf::after { content: ""; position: absolute; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); }
    .perf::before { right: -29px; }
    .perf::after { left: -29px; }
    .facts { margin: 0; padding: 18px 22px 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
    .facts dt { font-size: 12px; color: var(--muted); }
    .facts dd { margin: 2px 0 0; font-size: 15px; font-weight: 700; line-height: 1.7; overflow-wrap: anywhere; }
    .facts .wide { grid-column: span 2; }
    .facts .wide dd { font-weight: 400; }
    .facts .time dd { font-family: var(--display); font-size: 24px; font-weight: 400; line-height: 1.2; color: var(--hot); }
    .body { margin-top: 6px; font-size: 15px; line-height: 1.9; white-space: pre-line; overflow-wrap: anywhere; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 16px 0; }
    .pill-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px;
                 border: 1.5px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; }
    .card { margin: 20px 16px 0; padding: 18px; border-radius: 22px; background: var(--card); }
    .card-head { display: flex; align-items: center; gap: 12px; }
    .card-head h2 { font-size: 22px; line-height: 1.3; }
    .lamp { flex: 0 0 44px; height: 44px; border-radius: 50%; background: var(--saffron); color: #2A2030; display: flex; align-items: center; justify-content: center; }
    .pills { display: flex; gap: 8px; margin-top: 14px; }
    .pill { flex: 1 1 0; min-height: 46px; padding: 0 6px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 700; }
    .pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .artist-link { display: flex; align-items: center; gap: 14px; width: calc(100% - 32px); margin: 16px 16px 0; padding: 16px; border: 0;
                   border-radius: 22px; background: var(--teal); color: #F4FBFA; text-align: start; }
    .artist-link small { display: block; font-size: 13px; color: #CDEBE7; }
    .artist-link .display { display: block; font-size: 21px; }
    .cta-bar { position: sticky; bottom: 0; margin-top: 24px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
               background: var(--paper); border-top: 1px solid var(--line); }
    .primary { width: 100%; min-height: 56px; border: 0; border-radius: 18px; background: var(--pom); color: #FFFFFF; font-size: 17px;
               font-weight: 800; box-shadow: 0 10px 22px rgba(181,55,47,.28); }
    .status { margin-top: 10px; text-align: center; font-size: 13px; font-weight: 700; }
    .status:empty { display: none; }

    /* reminders: taped notes */
    .notes { padding: 30px 20px 0; display: flex; flex-direction: column; gap: 26px; }
    .note { position: relative; padding: 24px 18px 16px; border-radius: 6px; background: var(--card);
            box-shadow: 0 1px 0 var(--line), 0 10px 24px rgba(43,31,58,.08); transform: rotate(-1.2deg); }
    .note:nth-child(3n+2) { transform: rotate(.9deg); }
    .note:nth-child(3n) { transform: rotate(-.6deg); }
    .note::before { content: ""; position: absolute; top: -10px; left: 50%; width: 86px; height: 22px; margin-left: -43px;
                    background: #F6D58E; opacity: .92; transform: rotate(-3deg); }
    .note:nth-child(3n+2)::before { background: #BFE0DB; }
    .note:nth-child(3n)::before { background: #F2C4BC; }
    .note-row { display: flex; align-items: flex-start; gap: 8px; }
    .note-row > div { flex: 1; min-width: 0; }
    .note-title { font-size: 17px; font-weight: 700; line-height: 1.5; }
    .icon-btn { flex: 0 0 44px; width: 44px; height: 44px; margin: -8px 0 0 -8px; padding: 0; border: 0; border-radius: 50%;
                background: transparent; color: var(--pom-text); display: flex; align-items: center; justify-content: center; }
    .dashed-link { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 18px; border-radius: 16px;
                   border: 1.5px dashed var(--dash); background: transparent; text-align: start; font-size: 14px; line-height: 1.7; }
    .dashed-link strong { color: var(--link); }

    /* artists: cassettes on shelves */
    .search { display: flex; align-items: center; gap: 8px; margin: 16px 20px 0; padding: 0 14px; min-height: 50px; border-radius: 14px;
              background: var(--card); border: 1.5px solid var(--line); color: var(--muted); }
    .search:focus-within { outline: 3px solid var(--saffron); outline-offset: 2px; }
    .search input { flex: 1; min-width: 0; min-height: 46px; border: 0; background: transparent; color: var(--ink); font-size: 15px; outline: none; }
    .shelf { padding: 30px 14px 0; display: flex; flex-direction: column; gap: 28px; }
    .tapes { display: flex; gap: 14px; padding: 0 8px; align-items: flex-end; }
    .tape { flex: 1 1 0; min-width: 0; max-width: calc(50% - 7px); padding: 8px 8px 6px; border: 0; border-radius: 12px;
            background: #B5372F; box-shadow: 0 6px 14px rgba(43,31,58,.18); text-align: start; color: #2A2030; }
    .tape-1 { background: #1D6F6A; }
    .tape-2 { background: #F2B441; }
    .tape-3 { background: #2B1F3A; }
    .tape-4 { background: #5B4A70; }
    .tape-label { display: block; padding: 7px 10px 9px; border-radius: 6px; background: #FFF9F0; }
    .tape-name, .tape-bio { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tape-name { font-family: var(--display); font-size: 19px; line-height: 1.35; }
    .tape-bio { font-size: 11px; color: #6E6170; }
    .tape-window { display: flex; align-items: center; margin-top: 8px; height: 26px; padding: 0 12px; border-radius: 13px; background: #2A2030; }
    .reel { flex: 0 0 16px; height: 16px; border-radius: 50%; border: 3px solid #F4ECE0; }
    .tape-line { flex: 1; height: 2px; margin: 0 8px; background: #6E6170; }
    .tape-holes { display: flex; justify-content: center; gap: 24px; padding-top: 5px; }
    .tape-holes span { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,.25); }
    .plank { height: 14px; border-radius: 3px; background: var(--wood); border-bottom: 5px solid #6B4329; box-shadow: 0 8px 12px rgba(43,31,58,.12); }
    .empty-line { padding: 28px 16px; text-align: center; font-size: 14px; color: var(--muted); border-radius: 16px; border: 1.5px dashed var(--dash); }
    .cta-teal { margin: 28px 20px 0; padding: 20px; border-radius: 22px; background: var(--teal); color: #F4FBFA; }
    .cta-teal h2 { font-size: 24px; }
    .cta-teal p { margin: 2px 0 14px; font-size: 14px; line-height: 1.8; color: #CDEBE7; }
    .btn-paper { display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 18px; border: 0; border-radius: 14px;
                 background: #FFF9F0; color: #1D6F6A; font-size: 15px; font-weight: 800; }

    /* artist page + tip jar */
    .night.center { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 28px 24px 24px; }
    .night.center h1 { margin-top: 12px; font-size: 34px; }
    .night.center p { margin-top: 2px; max-width: 300px; font-size: 14px; line-height: 1.8; color: var(--on-night-muted); overflow-wrap: anywhere; }
    .jar-row { display: flex; align-items: flex-end; gap: 16px; }
    .jar-row > div:first-child { flex: 1; min-width: 0; }
    .jar-row h2 { font-size: 28px; }
    .jar { position: relative; flex: 0 0 96px; height: 116px; }
    .jar-lid { position: absolute; top: 0; left: 14px; right: 14px; height: 13px; border-radius: 4px; background: var(--wood); }
    .jar-glass { position: absolute; top: 10px; left: 0; right: 0; bottom: 0; border: 3px solid var(--ink);
                 border-radius: 22px 22px 30px 30px; background: rgba(95,194,182,.14); overflow: hidden; }
    .coin { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--saffron); border: 2px solid #C98A1E; }
    .label { display: block; margin: 18px 0 8px; font-size: 13px; font-weight: 700; }
    .segmented { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: var(--paper); }
    .segmented button { flex: 1 1 0; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px;
                        border: 0; border-radius: 12px; background: transparent; font-size: 14px; font-weight: 700; }
    .segmented button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .note-line { margin: 10px 2px 0; font-size: 13px; line-height: 1.8; color: var(--muted); }
    .tiers { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .tier { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 14px; border-radius: 16px;
            border: 2px solid var(--line); background: var(--field); text-align: start; }
    .tier[aria-pressed="true"] { border-color: var(--pom); background: var(--pom-soft); }
    .tier-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .tier-name { font-family: var(--display); font-size: 20px; line-height: 1.35; }
    .tier-amount { font-size: 15px; font-weight: 800; white-space: nowrap; }
    .field { display: block; margin-top: 14px; font-size: 14px; font-weight: 700; }
    .field input, .field textarea { display: block; width: 100%; margin-top: 6px; min-height: 48px; padding: 0 14px; border-radius: 14px;
                                    border: 1.5px solid var(--line); background: var(--field); font-size: 15px; font-weight: 400; color: var(--ink); }
    .field textarea { padding: 12px 14px; line-height: 1.8; resize: vertical; }
    .field input[dir="ltr"] { font: 14px ui-monospace, Menlo, monospace; }
    .hint { display: block; margin-top: 6px; font-size: 12px; font-weight: 400; line-height: 1.7; color: var(--muted); }
    .address { display: block; width: 100%; margin-top: 6px; padding: 12px; border-radius: 12px; border: 1.5px dashed var(--dash);
               background: transparent; font: 13px ui-monospace, Menlo, monospace; text-align: left; word-break: break-all; user-select: all; }
    #ton-connect { display: flex; justify-content: center; margin-top: 14px; }
    #ton-connect, #tc-widget-root { direction: ltr; } /* TON Connect UI is English-only */

    /* my artist profile */
    .status-card { display: flex; align-items: center; gap: 16px; }
    .stamp { flex: none; transform: rotate(-8deg); padding: 6px 12px; border: 3px double var(--hot); border-radius: 10px;
             color: var(--hot); font-family: var(--display); font-size: 19px; line-height: 1.25; text-align: center; }
    .stamp.approved { border-color: var(--link); color: var(--link); }
    .stamp.rejected { border-color: var(--muted); color: var(--muted); }
    .totals { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
    .info-row { display: flex; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--paper); font-size: 13px; line-height: 1.8; }
  </style>
</head>
<body>
  <main id="view"></main>
  <nav id="dock" aria-label="بخش‌ها" hidden></nav>
  <script>
    const tg = window.Telegram?.WebApp;
    const API = "/api/v1/miniapp";
    const UNKNOWN_TIME = "00:01";  // what the GPT extractor writes when a post has no time
    const UNITS = { XTR: "ستاره", GRAM: "GRAM", USDC: "USDC" };
    const STAMP = { pending: ["در انتظار", "تأیید"], approved: ["تأیید", "شده"], rejected: ["رد", "شده"] };
    const STATUS_TEXT = {
      pending: "ادمین آراگورن پروفایلت را بررسی می‌کند. تا تأیید نشود، صفحه‌ات برای دیگران دیده نمی‌شود.",
      approved: "صفحه‌ات روی قفسه است. لینک اشتراکش را ربات بعد از تأیید برایت فرستاده است.",
      rejected: "درخواستت تأیید نشد. اطلاعات را اصلاح کن و دوباره بفرست.",
    };
    // Tip-jar tiers: [name, description, coins in the jar]; amounts per rail below.
    const TIERS = [["یک چای", "برای استراحت بین دو ست", 3], ["یک دست سیم", "سیم نو برای ساز، صدای تازه", 6],
                   ["یک شب تمرین", "اجارهٔ اتاق تمرین برای یک شب", 11]];
    const TIER_AMOUNTS = { XTR: [50, 250, 1000], GRAM: [1, 5, 20] };
    const COIN_SPOTS = [[6, 2], [30, 2], [54, 2], [18, 20], [42, 20], [64, 6], [30, 38], [6, 24], [54, 36], [18, 56], [42, 56]];
    const RAILS = {
      XTR: ["ستاره", "star", "پرداخت داخل خود تلگرام. ستاره‌ها نزد آراگورن جمع می‌شود و ادمین با هنرمند تسویه می‌کند."],
      GRAM: ["GRAM", "gem", "مستقیم به کیف‌پول هنرمند روی شبکهٔ TON، با Wallet تلگرام یا Tonkeeper."],
      USDC: ["USDC", "coin", "فقط USDC روی شبکهٔ Base را مستقیم به کیف‌پول هنرمند بفرست، بعد هش تراکنش را اینجا بگذار."],
    };
    const ICONS = {
      note: '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
      bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
      cassette: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="11.5" r="1.8"/><circle cx="15.5" cy="11.5" r="1.8"/><path d="M7 18l1.5-3h7L17 18"/>',
      pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',

    async function api(path, body, method = body ? "POST" : "GET") {
      const res = await fetch(API + path, {
        method,
        headers: { "Authorization": "tma " + tg.initData, "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (typeof data.detail === "string") throw new Error(data.detail);
        throw new Error(res.status >= 500 ? "خطای سرور؛ کمی بعد دوباره امتحان کنید." : "مقادیر واردشده معتبر نیست.");
      }

    // ── Reminders: notes taped to the fridge ──────────────────────────────
    async function showReminders() {
      setChrome("reminders");

      for (const row of rows) {
        const group = groups.get(row.event_id) ?? { ...row, ids: [], hoursList: [] };
        group.ids.push(row.id);
        group.hoursList.push(row.hours);
        groups.set(row.event_id, group);

    // ── Artist page: the tip jar ──────────────────────────────────────────
    function showArtist(artist) {
      setChrome("artist", true);

      let rail = "XTR", tier = 1;

      const txHash = h("input", { placeholder: "0x…", dir: "ltr" });
      const usdcBox = artist.evm_address && h("div", {},
        h("span", { class: "label" }, "آدرس کیف‌پول هنرمند روی Base"),

        h("label", { class: "field" }, "هش تراکنش", txHash));
      const amount = () => custom.value || TIER_AMOUNTS[rail][tier];
      const cta = action("", async () => {
        if (rail === "XTR") {
          const { invoice_link } = await api(`/artists/${artist.id}/stars`, { amount: Number(amount()) });
          tg.openInvoice(invoice_link, result => {
            if (result === "paid") { status.textContent = "ممنون! حمایتت ثبت شد و به هنرمند خبر دادیم."; tg.HapticFeedback.notificationOccurred("success"); }

        if (gramBox) gramBox.hidden = rail !== "GRAM";
        if (usdcBox) usdcBox.hidden = rail !== "USDC";
        tierButtons.forEach((b, i) => {
          b.setAttribute("aria-pressed", String(!custom.value && i === tier));
          b.lastChild.textContent = rail === "USDC" ? "" : `${fa(TIER_AMOUNTS[rail][i])} ${UNITS[rail]}`;
        });
        custom.placeholder = rail === "XTR" ? "مثلاً ۱۰۰ ستاره" : "مثلاً ۲ GRAM";
        const coins = custom.value && rail !== "USDC"
          ? Math.max(1, Math.min(11, Math.round(11 * custom.value / TIER_AMOUNTS[rail][2])))
          : TIERS[tier][2];
        glass.replaceChildren(...COIN_SPOTS.slice(0, coins).map(([x, y]) => {
          const coin = h("span", { class: "coin" });
          coin.style.left = `${x}px`;
          coin.style.bottom = `${y}px`;
          return coin;
        }));
        cta.textContent = rail === "USDC" ? "ثبت تراکنش" : `${rail === "XTR" ? "پرداخت" : "ارسال"} ${fa(amount())} ${UNITS[rail]}`;
      }
      custom.oninput = paint;
      view.replaceChildren(
        h("header", { class: "night center" },
          svg('<circle cx="56" cy="56" r="54" fill="#17111F"/><circle cx="56" cy="56" r="46" fill="none" stroke="#3A2E4A"/>' +
              '<circle cx="56" cy="56" r="38" fill="none" stroke="#3A2E4A"/><circle cx="56" cy="56" r="30" fill="none" stroke="#3A2E4A"/>' +
              '<path d="M20 42 A38 38 0 0 1 42 20" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>' +
              '<circle cx="56" cy="56" r="20" fill="#B5372F"/><circle cx="56" cy="56" r="3" fill="#2B1F3A"/>', 'width="112" height="112" viewBox="0 0 112 112"'),
          h("h1", { class: "display" }, artist.name),
          artist.bio && h("p", {}, artist.bio)),
        h("section", { class: "card" },
          h("div", { class: "jar-row" },
            h("div", {}, h("h2", { class: "display" }, "کاسهٔ حمایت"),
              h("p", { class: "meta" }, "هر قدر دلت خواست. برای هنرمند مستقل، حتی یک چای یعنی «ادامه بده».")),
            h("div", { class: "jar", "aria-hidden": "true" }, h("span", { class: "jar-lid" }), glass)),
          h("span", { class: "label" }, "روش پرداخت"),
          h("div", { class: "segmented", role: "group", "aria-label": "روش پرداخت" }, ...railButtons),
          railNote, amountBox, gramBox, usdcBox),
        h("div", { class: "cta-bar" }, cta, status));
      paint();
      if (artist.ton_address) tonUI();
    }

    async function donateGram(artist, amount, status) {
      const ui = tonUI();
      if (!ui.connected) return ui.openModal();
      const donation = await api(`/artists/${artist.id}/gram`, { amount });
      try {
        await ui.sendTransaction({
          validUntil: Math.floor(Date.now() / 1000) + 600,
          messages: [{ address: donation.address, amount: donation.amount, payload: donation.payload }],
        });
      } catch {
        status.textContent = "تراکنش لغو شد.";
        return;
      }
      status.textContent = "تراکنش ارسال شد؛ در حال تأیید روی شبکه…";
      for (let i = 0; i < 30; i++) {
        await new Promise(resolve => setTimeout(resolve, 4000));
        const { status: state } = await api(`/donations/${donation.donation_id}/verify`, {});
        if (state === "confirmed") {
          status.textContent = "ممنون! حمایت GRAM تو تأیید شد.";
          tg.HapticFeedback.notificationOccurred("success");
          return;
        }
      }
      status.textContent = "تراکنش هنوز تأیید نشده؛ به‌محض تأیید روی شبکه ثبت می‌شود.";
    }

    // ── My artist profile ─────────────────────────────────────────────────
    async function showMe() {
      setChrome("me");
      loading();
      const { artist, totals } = await api("/me");
      if (currentView !== "me") return;
      const field = (name, label, hint, attrs = {}) =>
        h("label", { class: "field" }, label, h("input", { name, value: artist?.[name] || "", ...attrs }), hint && h("span", { class: "hint" }, hint));
      const form = h("form", { class: "card" },
        field("name", "نام هنرمندی یا گروه", "", { required: "", maxlength: "64" }),
        h("label", { class: "field" }, "معرفی کوتاه", h("textarea", { name: "bio", maxlength: "500", rows: "3" }, artist?.bio || "")),
        field("ton_address", "کیف‌پول TON، برای GRAM (اختیاری)", "آدرس با چک‌سام بررسی می‌شود؛ آدرس تست‌نت پذیرفته نیست.", { dir: "ltr", placeholder: "UQ…" }),
        field("evm_address", "کیف‌پول Base، برای USDC (اختیاری)", "فقط USDC روی شبکهٔ Base؛ واریز از شبکه‌های دیگر دیده نمی‌شود.", { dir: "ltr", placeholder: "0x…" }),
        h("div", { class: "info-row" }, icon("star", 20), h("p", {}, "ستاره‌های تلگرام هم فعال است: نزد آراگورن جمع می‌شود و ادمین با تو تسویه می‌کند.")),
        h("p", { class: "hint" }, "هر ویرایش دوباره برای بررسی ادمین فرستاده می‌شود."));
      form.onsubmit = event => event.preventDefault();
      view.replaceChildren(
        ...paperHeader("پروفایل هنرمندی من", "یک صفحه، تا طرفدارها مستقیم حمایتت کنند."),
        artist
          ? h("section", { class: "card" },
              h("div", { class: "status-card" },
                h("span", { class: `stamp ${artist.status}` }, STAMP[artist.status][0], h("br"), STAMP[artist.status][1]),
                h("p", { class: "meta" }, STATUS_TEXT[artist.status])),
              totals.length > 0 && h("ul", { class: "totals" }, ...totals.map(t =>
                h("li", {}, `${fa(t.count)} حمایت، مجموع `, amountEl(t.amount, UNITS[t.asset])))))
          : h("section", { class: "card" }, h("p", { class: "meta" }, "هنرمند مستقلی؟ پروفایلت را بساز تا طرفدارهایت مستقیم از تو حمایت کنند.")),
        form,
        h("div", { class: "cta-bar" }, action(artist ? "ذخیره و ارسال برای بررسی" : "ثبت درخواست هنرمندی", async () => {
          if (!form.reportValidity()) return;
          await api("/me", Object.fromEntries(new FormData(form)));
          notify("درخواستت ثبت شد و بعد از تأیید ادمین فعال می‌شود.");
          await showMe();
        })));
    }

    async function boot() {
      tg.ready();
      tg.expand();
      applyTheme();
      tg.onEvent("themeChanged", applyTheme);
      dock.append(h("div", { class: "dock" }, ...TABS.map(([tab, label, name]) =>
        h("button", { type: "button", "data-tab": tab, onclick: () => setTab(tab) }, icon(name), label))));
      tg.BackButton.onClick(() => setTab(currentTab));
      // Share links look like t.me/<bot>?startapp=artist_<id>
      const artistId = Number((tg.initDataUnsafe.start_param || "").replace("artist_", ""));
      if (artistId) {
        currentTab = "artists";
        return openArtist(artistId);
      }
      await showEvents();
    }

    if (tg?.initData) boot().catch(e => notify(e.message));
    else view.replaceChildren(h("p", { class: "loading" }, "این صفحه را از داخل ربات آراگورن در تلگرام باز کنید."));
  </script>
</body>
</html>
